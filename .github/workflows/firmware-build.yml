name: Firmware build

# Compile-checks the firmware so pull requests (including the automated
# upstream-sync PRs) get a green/red before anyone merges or flashes.
# Builds the NerdQAxePlus2 / 480x320 target only — the config this fork ships.
#
# The firmware bundles the Angular web UI (axe-os) into www.bin, and dist/ is
# gitignored, so the web UI must be built (npm) before idf.py build.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: idf.py build (NERDQAXEPLUS2, BIGSCREEN)
    runs-on: ubuntu-latest
    # ESP-IDF 5.3.6, matching upstream's v1.1.1-alpha3 toolchain bump. The
    # 480x320 build links clean with ~8% app-partition headroom (the earlier
    # IRAM overflow on newer 5.3.x was resolved by moving WiFi libs out of IRAM).
    container: espressif/idf:v5.3.6
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node (for the Angular web UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # Angular 18 needs Node 18.19+/20

      - name: Build web UI (axe-os -> dist, bundled into www.bin)
        working-directory: main/http_server/axe-os
        run: |
          npm ci
          npm run build

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'   # idf.py reads git version
          . "$IDF_PATH/export.sh"
          export BOARD=NERDQAXEPLUS2 BIGSCREEN=1
          idf.py set-target esp32s3
          idf.py build
